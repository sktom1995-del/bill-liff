<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็คสต็อก มนต์ชัย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --bd:#e5e5e5; --mut:#8a8a8a; --pri:#1f6f43; --danger:#b3261e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
         margin:0; background:#f4f4f2; color:#1a1a1a; }
  .wrap { max-width:520px; margin:0 auto; padding:14px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:12px; overflow:hidden; }
  label.lbl { font-size:13px; color:var(--mut); display:block; margin:0 0 6px; }
  select, input, button { font-size:15px; font-family:inherit; }
  select, input { width:100%; height:40px; border:1px solid var(--bd); border-radius:8px;
                  padding:0 10px; background:#fff; }
  .pad { padding:14px; }
  .head { display:grid; grid-template-columns:1fr 78px 52px; gap:8px;
          padding:0 2px 8px; border-bottom:1px solid var(--bd); }
  .head span { font-size:12px; color:var(--mut); }
  .head span:nth-child(2), .head span:nth-child(3){ text-align:center; }
  .row { display:grid; grid-template-columns:1fr 78px 52px; gap:8px; align-items:center;
         padding:10px 2px; border-bottom:1px solid var(--bd); }
  .row:last-child { border-bottom:none; }
  .row .nm { font-size:14px; }
  .row .code { font-size:11px; color:var(--mut); }
  .row input { height:36px; text-align:center; padding:0 4px; }
  .row .unit { font-size:13px; color:#555; text-align:center; }
  .save { width:100%; height:46px; border:none; border-radius:10px; background:#1a1a1a;
          color:#fff; font-weight:500; margin-top:2px; }
  .save:active { transform:scale(0.99); }
  .save:disabled { opacity:0.55; }
  .foot { border-top:1px solid var(--bd); padding:10px 14px; font-size:12px; color:var(--mut);
          display:flex; align-items:center; gap:8px; }
  .who { width:26px; height:26px; border-radius:50%; background:#e6efe9; color:var(--pri);
         display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .msg { font-size:13px; padding:8px 12px; border-radius:8px; margin-top:10px; display:none; }
  .msg.ok { background:#e6efe9; color:var(--pri); display:block; }
  .msg.err { background:#fbe9e7; color:var(--danger); display:block; }
  .empty { padding:24px 14px; text-align:center; color:var(--mut); font-size:14px; }
  h1 { font-size:18px; font-weight:600; margin:2px 2px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>เช็คสต็อก มนต์ชัย</h1>

  <div class="card">
    <div class="pad" style="padding-bottom:0;">
      <label class="lbl">เลือกบริษัท</label>
      <select id="company"><option value="">— กำลังโหลด —</option></select>
    </div>

    <div id="tableWrap" class="pad">
      <div class="empty">เลือกบริษัทเพื่อดูรายการสินค้า</div>
    </div>

    <div class="pad" style="padding-top:0; display:none;" id="saveWrap">
      <button class="save" id="saveBtn">บันทึกยอด</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="foot" id="foot" style="display:none;">
      <span class="who" id="whoInitial">?</span>
      <span id="whoName">—</span>
    </div>
  </div>
</div>

<script>
// ===== ตั้งค่า =====
var LIFF_ID = '2010866027-t5yhbYoL';
var GAS_URL = 'https://script.google.com/macros/s/AKfycby6V6vx8teACp8u975xqI4FA6JtUszqnLgkbaoOeZdjkr7LdQBJfUqOt5ZyabC75T2Hzw/exec';
// ===================

var profile = { userId:'', displayName:'' };
var currentProducts = [];
var currentCompany = '';

function api(payload) {
  return fetch(GAS_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // เลี่ยง preflight
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

function showMsg(text, cls) {
  var m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + cls;
  if (cls === 'ok') setTimeout(function(){ m.className='msg'; }, 3000);
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function renderProducts(list) {
  currentProducts = list;
  var wrap = document.getElementById('tableWrap');
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">ไม่มีสินค้าของบริษัทนี้</div>';
    document.getElementById('saveWrap').style.display='none';
    return;
  }
  var html = '<div class="head"><span>ชื่อสินค้า</span><span>คงเหลือ</span><span>หน่วย</span></div>';
  list.forEach(function(p, i){
    html += '<div class="row">'
      + '<div><div class="nm">'+escapeHtml(p.name)+'</div><div class="code">'+escapeHtml(p.code)+'</div></div>'
      + '<input type="number" inputmode="decimal" class="qty" data-i="'+i+'" value="'+p.qty+'">'
      + '<div class="unit">'+escapeHtml(p.unit)+'</div>'
      + '</div>';
  });
  wrap.innerHTML = html;
  document.getElementById('saveWrap').style.display='block';
}

function loadCompanies() {
  api({ action:'getCompanies' }).then(function(res){
    var sel = document.getElementById('company');
    if (!res.ok) { sel.innerHTML='<option value="">โหลดไม่ได้</option>'; return; }
    sel.innerHTML = '<option value="">— เลือกบริษัท —</option>'
      + res.companies.map(function(c){ return '<option>'+escapeHtml(c)+'</option>'; }).join('');
  }).catch(function(e){
    document.getElementById('company').innerHTML='<option value="">เชื่อมต่อไม่ได้</option>';
  });
}

function loadProducts(company) {
  currentCompany = company;
  var wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<div class="empty">กำลังโหลด…</div>';
  api({ action:'getProducts', company:company }).then(function(res){
    if (!res.ok) { wrap.innerHTML='<div class="empty">โหลดไม่ได้</div>'; return; }
    renderProducts(res.products);
  });
}

function save() {
  var qtys = document.querySelectorAll('.qty');
  var items = [];
  var changes = []; // เก็บเฉพาะตัวที่เลขเปลี่ยน ไว้ทำ Flex

  qtys.forEach(function(inp, idx){
    var p = currentProducts[idx];
    var newQty = Number(inp.value);
    items.push({ rowIndex: p.rowIndex, qty: inp.value });
    if (!isNaN(newQty) && newQty !== Number(p.qty)) {
      changes.push({ name: p.name, unit: p.unit, oldQty: Number(p.qty), newQty: newQty });
    }
  });

  if (!changes.length) { showMsg('ไม่มีการเปลี่ยนแปลง', 'err'); return; }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';

  api({ action:'saveStock', userId:profile.userId, displayName:profile.displayName, items:items })
    .then(function(res){
      btn.disabled=false; btn.textContent='บันทึกยอด';
      if (!res.ok) { showMsg(res.error || 'บันทึกไม่สำเร็จ', 'err'); return; }
      res.updated.forEach(function(u){
        currentProducts.forEach(function(p, idx){
          if (p.rowIndex === u.rowIndex) {
            p.qty = u.qty;
            document.querySelectorAll('.qty')[idx].value = u.qty;
          }
        });
      });
      showMsg('บันทึกแล้ว', 'ok');
      sendFlexSummary(changes); // ยิง Flex สรุปเฉพาะที่เปลี่ยน
    })
    .catch(function(e){
      btn.disabled=false; btn.textContent='บันทึกยอด';
      showMsg('เชื่อมต่อไม่ได้: '+e, 'err');
    });
}

// สร้าง Flex Message สรุปรายการที่เปลี่ยน แล้วส่งเข้าแชท OA ที่เปิดอยู่
function sendFlexSummary(changes) {
  if (!liff.isInClient || !liff.isInClient()) return; // เปิดนอก LINE ไม่ส่ง/ไม่ปิด

  var now = new Date();
  var timeStr = now.toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' });

  var rows = changes.map(function(c){
    var diff = c.newQty - c.oldQty;
    var arrow = diff > 0 ? '▲' : '▼';
    var diffColor = diff > 0 ? '#1f6f43' : '#b3261e';
    return {
      type:'box', layout:'horizontal', spacing:'sm', margin:'md',
      contents:[
        { type:'text', text:c.name, size:'sm', color:'#333333', flex:5, wrap:true },
        { type:'text', text:c.oldQty+' → '+c.newQty+' '+c.unit, size:'sm',
          color:'#666666', align:'end', flex:4 },
        { type:'text', text:arrow, size:'sm', color:diffColor, align:'end', flex:1 }
      ]
    };
  });

  var bubble = {
    type:'bubble',
    header:{
      type:'box', layout:'vertical', paddingAll:'14px', backgroundColor:'#1f6f43',
      contents:[
        { type:'text', text:'อัปเดตสต็อก', color:'#ffffff', weight:'bold', size:'md' },
        { type:'text', text:currentCompany, color:'#d7ecdf', size:'sm', margin:'xs' }
      ]
    },
    body:{
      type:'box', layout:'vertical', paddingAll:'14px', spacing:'none',
      contents:[
        { type:'text', text:'รายการที่แก้ ('+changes.length+')', size:'xs', color:'#999999' }
      ].concat(rows)
    },
    footer:{
      type:'box', layout:'vertical', paddingAll:'12px',
      contents:[
        { type:'text', text:'โดย '+(profile.displayName||'-')+' · '+timeStr,
          size:'xs', color:'#aaaaaa', wrap:true }
      ]
    }
  };

  liff.sendMessages([
    { type:'flex', altText:'อัปเดตสต็อก '+currentCompany+' ('+changes.length+' รายการ)',
      contents: bubble }
  ]).then(function(){
    liff.closeWindow(); // ส่ง Flex เสร็จแล้วค่อยปิดหน้า LIFF
  }).catch(function(e){
    // ส่งไม่สำเร็จ: ไม่ปิดหน้า จะได้เห็น error (ยอดบันทึกลงชีตไปแล้ว)
    showMsg('ส่ง Flex ไม่สำเร็จ: ' + (e && e.message ? e.message : JSON.stringify(e)), 'err');
  });
}

function initUI() {
  document.getElementById('company').addEventListener('change', function(){
    var c = this.value;
    if (c) loadProducts(c);
    else {
      document.getElementById('tableWrap').innerHTML='<div class="empty">เลือกบริษัทเพื่อดูรายการสินค้า</div>';
      document.getElementById('saveWrap').style.display='none';
    }
  });
  document.getElementById('saveBtn').addEventListener('click', save);
  loadCompanies();
}

liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login(); return; }
  return liff.getProfile();
}).then(function(p){
  if (!p) return;
  profile.userId = p.userId;
  profile.displayName = p.displayName || '';
  var foot = document.getElementById('foot');
  foot.style.display='flex';
  document.getElementById('whoName').textContent = 'ผู้แก้: ' + profile.displayName;
  document.getElementById('whoInitial').textContent = (profile.displayName||'?').slice(0,1);
  initUI();
}).catch(function(err){
  document.getElementById('foot').style.display='none';
  initUI(); // เปิดนอก LINE ก็ยังทดสอบได้ (userId ว่าง)
});
</script>
</body>
</html>
